<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WorldMapPin</title>
    <meta name="description" content="Join WorldMapPin to explore and share unique travel experiences. Discover new destinations through the eyes of fellow travelers and post your own journey on our interactive map." />
    <link rel="canonical" href="https://worldmappin.com" />

    <!-- Schema.org for Google -->
    <script type="application/ld+json">
    {
        "@context": "http://schema.org",
        "@type": "WebSite",
        "name": "WorldMapPin",
        "url": "https://worldmappin.com",
        "potentialAction": {
            "@type": "SearchAction",
            "target": "https://worldmappin.com/search?query={search_term_string}",
            "query-input": "required name=search_term_string"
        }
    }
    </script>

    <style>
      body {
        font-size: 16px;
        margin: 0;
        font-family: sans-serif;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import '@vis.gl/react-google-maps/examples.css';
      import '@vis.gl/react-google-maps/examples.js';
      import {renderToDom} from './src/app';

      renderToDom(document.querySelector('#app'));
    </script>
  </body>
</html>
